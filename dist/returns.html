<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Is the Borrowed Oil Due Back?</title>
<meta name="description" content="The earliest and latest dates the government's terms allow for returning the oil lent from the Strategic Petroleum Reserve in 2026.">
<style>
/* Light scheme painted explicitly so the page holds inside the Prismic frame
   whatever the viewer's OS theme. Two series, the first two slots of the
   validated reference palette in fixed order. */
:root {
  --bg: #FBFAF7; --panel: #ffffff; --ink: #14181d; --muted: #5b6470;
  --grid: #d9d6cf; --hair: #ebe8e1; --band: #eef1f5; --teal: #085041;
  --c-late: #2a78d6; --c-early: #eb6834;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 32px; container-type: inline-size; position: relative; }
.logo { height: 24px; width: auto; display: block; margin-bottom: 12px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.standfirst { font-size: 15px; color: var(--muted); margin: 0; max-width: 76ch; }
header.masthead { border-bottom: 1px solid var(--grid); padding-bottom: 12px; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.card { background: var(--panel); border: 1px solid var(--hair); border-radius: 6px; padding: 10px 12px; }
.card .k { font-size: 12.5px; color: var(--muted); }
.card .v { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; margin: 2px 0; }
.card .s { font-size: 12px; color: var(--muted); }

figure { margin: 0; background: var(--panel); border: 1px solid var(--hair); border-radius: 6px; padding: 12px 12px 8px; position: relative; }
figure h2 { font-size: 16px; margin: 0 0 2px; }
.sub { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 0 0 4px; padding: 0; list-style: none; font-size: 12.5px; }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: 0 0 14px; }
.sw.box { height: 11px; width: 11px; flex-basis: 11px; }
svg { display: block; width: 100%; }
svg text { font-family: var(--sans); fill: var(--muted); font-size: 12px; }
svg .ink { fill: var(--ink); font-weight: 600; }
svg .gridline { stroke: var(--hair); }
svg .axis { stroke: var(--grid); }

.tip { position: absolute; pointer-events: none; z-index: 5; max-width: 280px; padding: 9px 11px; background: var(--ink); color: #fff; border-radius: 6px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 20px rgba(20,24,29,.25); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip b { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

details { margin-top: 14px; font-size: 13.5px; }
summary { cursor: pointer; font-weight: 600; color: var(--teal); }
.tblwrap { overflow: auto; border: 1px solid var(--grid); border-radius: 6px; background: var(--panel); margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--hair); }
th { font-weight: 700; border-bottom: 1px solid var(--grid); }
td.num, th.num { text-align: right; }
.notes { font-size: 12.5px; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 10px; }
.notes p { margin: 0 0 6px; max-width: 100ch; }
.notes a { color: var(--teal); }

@container (max-width: 830px) { .cards { grid-template-columns: 1fr; } }
html.embed .wrap { padding: 12px 14px 12px; }
html.embed .logo { height: 18px; margin-bottom: 6px; }
html.embed h1 { font-size: 21px; }
html.embed .standfirst { font-size: 13.5px; }
html.embed .cards { margin: 10px 0; }
</style>
</head>

    <div class="tip" id="tip" role="status"></div>
  </figure>

  <details>
    <summary>See the numbers as a table</summary>
    <div class="tblwrap"><table id="tbl"></table></div>
  </details>
  <div class="notes" id="notes"></div>
</div>

<script>
const DATA = {"built":"2026-10-11","earliest":[["2026-09-01",10000000],["2026-11-01",35220000],["2027-01-01",32980000],["2027-04-01",13500000],["2027-08-01",15830000],["2028-01-01",26030000]],"latest":[["2027-11-30",8480000],["2028-03-31",500000],["2028-09-30",45220000],["2028-12-31",32860000],["2029-03-31",13500000],["2029-04-30",13500000],["2029-07-31",19500000]],"receipt_per_month":10500000};
if (window.self !== window.top) document.documentElement.classList.add("embed");

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const day = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const longDate = iso => { const [y, m, d] = iso.split("-").map(Number); return MONTHS[m - 1] + " " + d + ", " + y; };
const iso = t => new Date(t).toISOString().slice(0, 10);
const mil = v => { const m = v / 1e6; return m >= 100 ? m.toFixed(1) : (Math.round(m * 10) / 10).toString(); };
const pct = (v, t) => Math.round(v / t * 100) + "%";

const TOTAL = DATA.latest.reduce((s, [, n]) => s + n, 0);
const backBy = (series, isoDate) => series.reduce((s, [d, n]) => s + (d <= isoDate ? n : 0), 0);
const lastDue = DATA.latest[DATA.latest.length - 1][0];
const firstYear = Number(DATA.earliest[0][0].slice(0, 4)), lastYear = Number(lastDue.slice(0, 4));
const years = []; for (let y = firstYear; y <= lastYear; y++) years.push(y);

document.getElementById("standfirst").textContent =
  `The government agreed to lend companies ${mil(TOTAL)} million barrels from the emergency reserve in 2026. The government set the dates they can give it back. It has not said which dates each company picked, so the public can only see the earliest and latest the rules allow.`;

const monthsNeeded = Math.ceil(TOTAL / DATA.receipt_per_month);
document.getElementById("chartsub").textContent =
  `Million barrels returned, not counting the extra oil owed. The real path is somewhere in the shaded area. The orange line is not physically possible: the reserve sites can take back about ${mil(DATA.receipt_per_month)} million barrels a month combined, so returning all of it would take at least ${monthsNeeded} months.`;

// Cards: what the rules guarantee at each year-end, then the last due date.
const cardYears = years.filter(y => backBy(DATA.latest, y + "-12-31") < TOTAL).slice(-2);
document.getElementById("cards").innerHTML = cardYears.map(y => {
  const due = backBy(DATA.latest, y + "-12-31"), could = backBy(DATA.earliest, y + "-12-31");
  return `<div class="card"><div class="k">Due back by contract by the end of ${y}</div><div class="v">${mil(due)} million</div><div class="s">${pct(due, TOTAL)} of the oil awarded, if no dates are pushed back. The contract dates would permit up to ${mil(could)} million.</div></div>`;
}).join("") + `<div class="card"><div class="k">Last barrels due</div><div class="v">${longDate(lastDue)}</div><div class="s">${mil(TOTAL - backBy(DATA.latest, (lastYear - 1) + "-12-31"))} million barrels can stay out into ${lastYear}.</div></div>`;

function draw() {
  const host = document.getElementById("chart"), W = Math.max(host.clientWidth, 300), H = W < 520 ? 300 : 360;
  const M = { l: 44, r: W < 520 ? 14 : 20, t: 14, b: 30 };
  const t0 = Date.UTC(firstYear, 6, 1), t1 = Date.UTC(lastYear, 11, 31);
  const x = t => M.l + (W - M.l - M.r) * (t - t0) / (t1 - t0), y = v => H - M.b - (H - M.t - M.b) * v / TOTAL;
  const steps = s => { let c = 0; const pts = [[t0, 0]]; s.forEach(([d, n]) => { pts.push([day(d), c]); c += n; pts.push([day(d), c]); }); pts.push([t1, c]); return pts; };
  const E = steps(DATA.earliest), L = steps(DATA.latest), path = p => p.map(([t, v], i) => (i ? "L" : "M") + x(t).toFixed(1) + " " + y(v).toFixed(1)).join("");
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-labelledby="charttitle">`;
  const ticks = []; for (let v = 0; v < TOTAL - 12e6; v += 25e6) ticks.push(v);   // round steps, then the total itself
  ticks.concat(TOTAL).forEach(v => {
    s += `<line class="${v ? "gridline" : "axis"}" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${v === TOTAL ? mil(v) : Math.round(v / 1e6)}</text>`; });
  years.concat(lastYear + 1).forEach(yr => { const t = Date.UTC(yr, 0, 1); if (t < t0 || t > t1) return;
    s += `<line class="gridline" x1="${x(t)}" x2="${x(t)}" y1="${M.t}" y2="${H - M.b}"/>`; });
  years.forEach(yr => { const a = Math.max(Date.UTC(yr, 0, 1), t0), b = Math.min(Date.UTC(yr, 11, 31), t1);
    s += `<text x="${(x(a) + x(b)) / 2}" y="${H - 9}" text-anchor="middle">${yr}</text>`; });
  s += `<path d="${path(E)}${path(L.slice().reverse()).replace("M", "L")}Z" fill="var(--band)"/>`;
  s += `<path d="${path(E)}" fill="none" stroke="var(--c-early)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<path d="${path(L)}" fill="none" stroke="var(--c-late)" stroke-width="2" stroke-linejoin="round"/>`;
  const now = day(DATA.built);
  if (now > t0 && now < t1) s += `<line x1="${x(now)}" x2="${x(now)}" y1="${M.t}" y2="${H - M.b}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(now) + 5}" y="${M.t + 10}">Chart built</text>`;
  s += `<line id="cross" y1="${M.t}" y2="${H - M.b}" stroke="var(--ink)" stroke-width="1" visibility="hidden"/>`;
  s += `<rect id="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}" fill="transparent"/></svg>`;
  host.innerHTML = s;
  const tip = document.getElementById("tip"), cross = host.querySelector("#cross"), hit = host.querySelector("#hit"), fig = host.parentElement;
  hit.addEventListener("mousemove", ev => {
    const box = host.querySelector("svg").getBoundingClientRect(), px = (ev.clientX - box.left) * W / box.width;
    const d = iso(t0 + (t1 - t0) * (px - M.l) / (W - M.l - M.r)), lo = backBy(DATA.latest, d), hi = backBy(DATA.earliest, d);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `${longDate(d)}<br>Due back by contract: <b>${mil(lo)} million</b><br>Earliest dates would permit: <b>${mil(hi)} million</b>`;
    tip.classList.add("on");
    const f = fig.getBoundingClientRect(), left = ev.clientX - f.left + 14;
    tip.style.left = Math.min(left, f.width - tip.offsetWidth - 8) + "px"; tip.style.top = (ev.clientY - f.top + 14) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.classList.remove("on"); cross.setAttribute("visibility", "hidden"); });
}
draw();
new ResizeObserver(draw).observe(document.getElementById("chart"));

const dates = [...new Set(DATA.earliest.concat(DATA.latest).map(r => r[0]))].sort();
document.getElementById("tbl").innerHTML = `<thead><tr><th>By this date</th><th class="num">Due back by contract (latest the rules allow)</th><th class="num">Earliest the contract dates permit (not physically possible)</th></tr></thead><tbody>` +
  dates.map(d => `<tr><td>${longDate(d)}</td><td class="num">${backBy(DATA.latest, d).toLocaleString("en-US")}</td><td class="num">${backBy(DATA.earliest, d).toLocaleString("en-US")}</td></tr>`).join("") + "</tbody>";

document.getElementById("notes").innerHTML = `
  <p><b>How to read it.</b> The orange line assumes every company returns its oil on the first day the rules allow. That cannot happen in practice. The government lists how much oil each site can take back in a month, and the four sites add up to about ${mil(DATA.receipt_per_month)} million barrels. The orange line shows only what the contract dates permit. The ${monthsNeeded}-month figure is a floor: it leaves out the extra oil owed and lower limits at some sites. The contracts also call for returns to be spread out over the return period, not made on one day. The blue line assumes every company waits until the last day its contract allows. Neither is a forecast, and neither is a guarantee: the government can agree to later dates, and a contract can excuse a late return in cases such as war.</p>
  <p><b>Why there are two lines.</b> The government publishes how many barrels each company won in each round. It does not publish which pickup month or return date each company chose. Within each round, the lines place the awarded barrels in the offers with the earliest or the latest return dates, without putting more oil in any offer than the government made available.</p>
  <p><b>What is not shown.</b> The extra oil owed on top of each barrel, the round with results still pending, and any change to return dates the government may agree to later.</p>
  <p><b>Sources.</b> U.S. Department of Energy requests for proposals and award sheets, <a href="https://www.spr.doe.gov/posting/" target="_blank" rel="noopener">spr.doe.gov</a>. Method and code: <a href="https://github.com/Data4ThePeople/spr-exchange" target="_blank" rel="noopener">github.com/Data4ThePeople/spr-exchange</a>. Built ${longDate(DATA.built)}.</p>
  <p>Built by Data 4 The People.</p>`;
</script>
</body>
</html>
