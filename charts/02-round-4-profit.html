"608" y2="414" stroke="#2E3133" stroke-width="1"/><text x="32" y="442" font-size="16" fill="#BBBDC0" font-weight="400" text-anchor="start">How much higher the price on bid day was than</text><text x="608" y="442" font-size="16" fill="#E6E7E8" font-weight="700" text-anchor="end">32.3%</text><text x="32" y="464" font-size="16" fill="#BBBDC0" font-weight="400" text-anchor="start">the price for November to December 2029</text><line x1="32" y1="478" x2="608" y2="478" stroke="#2E3133" stroke-width="1"/><text x="32" y="506" font-size="16" fill="#BBBDC0" font-weight="400" text-anchor="start">Extra oil the government asked for</text><text x="608" y="506" font-size="16" fill="#E6E7E8" font-weight="700" text-anchor="end">17.5%</text><line x1="32" y1="520" x2="608" y2="520" stroke="#2E3133" stroke-width="1"/><text x="32" y="548" font-size="15" fill="#8C8F93" font-weight="400" text-anchor="start">Estimated profit before transportation costs, if prices</text><text x="32" y="568" font-size="15" fill="#8C8F93" font-weight="400" text-anchor="start">were locked in the day bids were due</text><text x="32" y="608" font-size="34" fill="#E6E7E8" font-weight="700" text-anchor="start">$47 million</text><text x="32" y="634" font-size="15" fill="#BBBDC0" font-weight="400" text-anchor="start">Trading companies borrowed 4.8 million barrels, times $9.87.</text><text x="32" y="656" font-size="15" fill="#BBBDC0" font-weight="400" text-anchor="start">The real figure could be much lower or higher.</text><text x="32" y="692" font-size="12" fill="#8C8F93" font-weight="400" text-anchor="start">Best lot and return window: Bryan Mound, Nov 2026 pickup, returned Nov-Dec 2029, at the</text><text x="32" y="709" font-size="12" fill="#8C8F93" font-weight="400" text-anchor="start">lowest premium allowed. Bids above the minimum would leave less. Sale price is the futures contract</text><text x="32" y="726" font-size="12" fill="#8C8F93" font-weight="400" text-anchor="start">for the month after pickup. Leaves out shipping, crude quality, the bank guarantee and interest.</text><text x="32" y="743" font-size="12" fill="#8C8F93" font-weight="400" text-anchor="start">Sources: U.S. Department of Energy award sheet and RFP DE-RP96-26PO00006; NYMEX WTI</text><text x="32" y="760" font-size="12" fill="#8C8F93" font-weight="400" text-anchor="start">futures closes as relayed by Yahoo Finance, retrieved October 11, 2026.</text><text x="32" y="782" font-size="12" fill="#BBBDC0" font-weight="700" text-anchor="start">Built by Data 4 The People</text></svg></body></html>
