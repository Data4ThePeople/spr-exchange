.1092896174864" y="806.0" font-size="15" fill="#BBBDC0" font-weight="700" text-anchor="start">$0.63</text><text x="442" y="836.0" font-size="15" fill="#BBBDC0" font-weight="400" text-anchor="end">Returned Oct-Dec 2028, 14% extra owed</text><path d="M586.2076502732241 820 H914.3897996357014 Q918.3897996357014 820 918.3897996357014 824 V838 Q918.3897996357014 842 914.3897996357014 842 H586.2076502732241 Z" fill="#3987e5"/><text x="926.3897996357014" y="836.0" font-size="15" fill="#BBBDC0" font-weight="700" text-anchor="start">$6.56</text><text x="442" y="866.0" font-size="15" fill="#BBBDC0" font-weight="400" text-anchor="end">Returned Jan-Mar 2029, 15% extra owed</text><path d="M586.2076502732241 850 H939.7085610200365 Q943.7085610200365 850 943.7085610200365 854 V868 Q943.7085610200365 872 939.7085610200365 872 H586.2076502732241 Z" fill="#3987e5"/><text x="951.7085610200365" y="866.0" font-size="15" fill="#BBBDC0" font-weight="700" text-anchor="start">$7.06</text><text x="442" y="896.0" font-size="15" fill="#BBBDC0" font-weight="400" text-anchor="end">Returned Apr-Jun 2029, 16% extra owed</text><path d="M586.2076502732241 880 H962.4954462659381 Q966.4954462659381 880 966.4954462659381 884 V898 Q966.4954462659381 902 962.4954462659381 902 H586.2076502732241 Z" fill="#3987e5"/><text x="974.4954462659381" y="896.0" font-size="15" fill="#BBBDC0" font-weight="700" text-anchor="start">$7.51</text><line x1="586.2076502732241" y1="782" x2="586.2076502732241" y2="902" stroke="#5A5E62" stroke-width="1"/><text x="24" y="942" font-size="13" fill="#8C8F93" font-weight="400" text-anchor="start">This is the most a borrower could make: the premium each company bid is not public and can be higher than the minimum.</text><text x="24" y="962" font-size="13" fill="#8C8F93" font-weight="400" text-anchor="start">Leaves out shipping, differences in crude quality, the cost of the required bank guarantee, and interest on the sale money.</text><text x="24" y="982" font-size="13" fill="#8C8F93" font-weight="400" text-anchor="start">Source: U.S. Department of Energy request for proposals DE-RP96-26PO00006; NYMEX WTI futures closes as relayed by Yahoo Finance,</text><text x="24" y="1002" font-size="13" fill="#8C8F93" font-weight="400" text-anchor="start">retrieved October 11, 2026. A return price is the average of the window&#x27;s monthly contracts; Yahoo does not serve September and</text><text x="24" y="1022" font-size="13" fill="#8C8F93" font-weight="400" text-anchor="start">October 2029, so Aug-Oct 2029 uses August alone.</text><text x="24" y="1042" font-size="13" fill="#BBBDC0" font-weight="700" text-anchor="start">Built by Data 4 The People</text></svg></body></html>
